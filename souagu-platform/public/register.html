<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>注册 - 持仓助手</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-header">
      <h1 class="auth-title">持仓助手</h1>
      <p class="auth-subtitle">注册成为老师，展示你的持仓</p>
    </div>
    
    <div class="auth-form">
      <form id="registerForm">
        <div class="form-group">
          <label>账号</label>
          <input type="text" id="username" class="input" placeholder="至少3个字符" required autocomplete="username">
        </div>
        
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="password" class="input" placeholder="至少6个字符" required autocomplete="new-password">
        </div>
        
        <div class="form-group">
          <label>昵称（选填）</label>
          <input type="text" id="nickname" class="input" placeholder="显示给学生的名称">
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
        
        <button type="submit" class="btn auth-btn">注册</button>
      </form>
      
      <div class="auth-footer">
        已有账号？<a href="/login">立即登录</a>
      </div>
    </div>
  </div>
  
  <script src="/js/common.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('error');
      errorEl.style.display = 'none';
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const nickname = document.getElementById('nickname').value.trim();
      
      if (!username || !password) {
        errorEl.textContent = '请输入账号和密码';
        errorEl.style.display = 'block';
        return;
      }
      
      try {
        await api.post('/api/auth/register', { username, password, nickname });
        window.location.href = '/dashboard';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
