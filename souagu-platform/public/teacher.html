<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>持仓 - 持仓助手</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1a73e8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, "Microsoft YaHei", sans-serif; 
      background: #f5f5f5; 
      color: #333;
      min-height: 100vh;
      padding-bottom: 20px;
    }
    .header {
      background: #fff;
      padding: 16px;
      border-bottom: 1px solid #eee;
    }
    .teacher-name {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .teacher-bio {
      font-size: 13px;
      color: #999;
    }
    .summary-bar {
      background: #fff;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #f0f0f0;
    }
    .summary-item {
      text-align: center;
    }
    .summary-label {
      font-size: 11px;
      color: #999;
      margin-bottom: 2px;
    }
    .summary-value {
      font-size: 15px;
      font-weight: 600;
    }
    .up { color: #e74c3c; }
    .down { color: #27ae60; }
    .flat { color: #999; }
    .holdings {
      margin-top: 10px;
      background: #fff;
      padding: 0 16px;
    }
    .holding-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f5f5f5;
    }
    .holding-row:last-child {
      border-bottom: none;
    }
    .holding-left {
      flex: 1;
    }
    .holding-name {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 2px;
    }
    .holding-code {
      font-size: 12px;
      color: #999;
    }
    .holding-right {
      text-align: right;
    }
    .holding-price {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 2px;
    }
    .holding-change {
      font-size: 12px;
    }
    .tip-section {
      margin-top: 16px;
      background: #fff;
      padding: 20px 16px;
      text-align: center;
    }
    .tip-title {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 12px;
    }
    .tip-qr {
      width: 140px;
      height: 140px;
      margin: 0 auto;
      border-radius: 8px;
      overflow: hidden;
    }
    .tip-qr img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .no-qr {
      width: 100%;
      height: 100%;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
      font-size: 13px;
    }
    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #bbb;
      padding: 10px;
    }
    .empty-tip {
      text-align: center;
      color: #999;
      font-size: 13px;
      padding: 30px 0;
    }
    .loading {
      text-align: center;
      color: #999;
      font-size: 13px;
      padding: 30px 0;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading">加载中...</div>
  </div>
  
  <script>
    const teacherId = window.location.pathname.split('/').pop();
    let prices = {};
    let holdings = [];
    let teacherData = null;
    
    async function init() {
      try {
        const res = await fetch(`/api/teacher/${teacherId}/holdings`);
        const data = await res.json();
        
        if (!data.teacher) {
          document.getElementById('app').innerHTML = '<div class="empty-tip">老师不存在</div>';
          return;
        }
        
        teacherData = data.teacher;
        holdings = data.holdings;
        
        render();
        refreshPrices();
        setInterval(refreshPrices, 30000);
      } catch (e) {
        console.error(e);
        document.getElementById('app').innerHTML = '<div class="empty-tip">加载失败</div>';
      }
    }
    
    async function refreshPrices() {
      if (holdings.length === 0) return;
      
      const codes = holdings.map(h => h.stock_code);
      
      try {
        const promises = codes.map(code => 
          fetch(`https://qt.gtimg.cn/q=${code}`).then(r => r.text())
        );
        const results = await Promise.all(promises);
        
        results.forEach(text => {
          const match = text.match(/v_([A-Z0-9]+)="(.+)"/);
          if (match) {
            const code = match[1].toLowerCase();
            const parts = match[2].split('~');
            if (parts.length >= 5) {
              prices[code] = {
                price: parseFloat(parts[3]),
                changePct: parseFloat(parts[32]) || 0
              };
            }
          }
        });
        
        render();
      } catch (e) {
        console.error('获取行情失败', e);
      }
    }
    
    function render() {
      let totalCost = 0, totalMv = 0;
      
      holdings.forEach(h => {
        const p = prices[h.stock_code.toLowerCase()] || {};
        const price = p.price || 0;
        const mv = h.quantity * price;
        const cost = h.quantity * h.cost_price;
        totalCost += cost;
        totalMv += mv;
      });
      
      const totalPl = totalMv - totalCost;
      const totalPlPct = totalCost > 0 ? ((totalMv / totalCost - 1) * 100) : 0;
      const plCls = totalPl > 0 ? 'up' : totalPl < 0 ? 'down' : 'flat';
      
      let html = `
        <div class="header">
          <div class="teacher-name">${teacherData.nickname || teacherData.username}</div>
          <div class="teacher-bio">${teacherData.bio || '暂无简介'}</div>
        </div>
        
        <div class="summary-bar">
          <div class="summary-item">
            <div class="summary-label">总市值</div>
            <div class="summary-value">${fmt(totalMv)}</div>
          </div>
          <div class="summary-item">
            <div class="summary-label">总盈亏</div>
            <div class="summary-value ${plCls}">${totalPl >= 0 ? '+' : ''}${fmt(totalPl)}</div>
          </div>
          <div class="summary-item">
            <div class="summary-label">收益率</div>
            <div class="summary-value ${plCls}">${totalPlPct >= 0 ? '+' : ''}${totalPlPct.toFixed(2)}%</div>
          </div>
        </div>
        
        <div class="holdings">
      `;
      
      if (holdings.length === 0) {
        html += '<div class="empty-tip">暂无持仓</div>';
      } else {
        holdings.forEach(h => {
          const p = prices[h.stock_code.toLowerCase()] || {};
          const price = p.price || 0;
          const changePct = p.changePct || 0;
          const mv = h.quantity * price;
          const cost = h.quantity * h.cost_price;
          const pl = mv - cost;
          const cls = pl > 0 ? 'up' : pl < 0 ? 'down' : 'flat';
          
          html += `
            <div class="holding-row">
              <div class="holding-left">
                <div class="holding-name">${h.stock_name}</div>
                <div class="holding-code">${h.stock_code} · ${fmt0(h.quantity)}股</div>
              </div>
              <div class="holding-right">
                <div class="holding-price ${cls}">${price ? price.toFixed(2) : '—'}</div>
                <div class="holding-change ${cls}">${changePct >= 0 ? '+' : ''}${changePct.toFixed(2)}%</div>
              </div>
            </div>
          `;
        });
      }
      
      html += '</div>';
      
      if (teacherData.tip_qr) {
        html += `
          <div class="tip-section">
            <div class="tip-title">觉得不错？请老师喝杯咖啡</div>
            <div class="tip-qr">
              <img src="${teacherData.tip_qr}">
            </div>
          </div>
        `;
      }
      
      html += '<div class="footer">持仓助手 · 实时更新</div>';
      
      document.getElementById('app').innerHTML = html;
    }
    
    function fmt(n) {
      return Math.round(n).toLocaleString('en-US');
    }
    
    function fmt0(n) {
      return Math.round(n).toLocaleString('en-US');
    }
    
    init();
  </script>
</body>
</html>
